  <header class="topbar">
    <div class="brand"><span class="logo">🎓</span><div><strong>116學測考場配置工作台</strong><small>臺北市立陽明高中｜35間正式考場＋1間備用考場</small></div></div>
    <div class="top-actions">

    </div>
  </header>

  <main>
    <section class="planning-note"><span style="font-size:1.6rem">🧮</span><div><strong>目前的試算基礎</strong><p>各班人數先沿用現有英聽工作台資料，每間考場統一保留36套桌椅。高二全部作為考場後，內部互相調度仍有8套總缺口；頁面保留編輯、匯出及列印功能，取得116學年實際人數後可直接修正。</p></div></section>

    </section>

  <div id="toast" class="toast" role="status"></div>
  <script>

const roomSeed=[

 {grade:'國七',name:'705班',building:'立志樓',floor:'4F',students:30,type:'main'},
 {grade:'國七',name:'706班',building:'立志樓',floor:'4F',students:31,type:'support'},
 {grade:'國八',name:'801班',building:'立志樓',floor:'3F',students:21,type:'support'},

 {grade:'國八',name:'806班',building:'立志樓',floor:'3F',students:33,type:'support'},

 {grade:'國九',name:'904班',building:'立志樓',floor:'2F',students:30,type:'main'},
 {grade:'國九',name:'905班',building:'立志樓',floor:'2F',students:32,type:'main'},
 {grade:'國九',name:'906班',building:'立志樓',floor:'2F',students:31,type:'support'},
 {grade:'高一',name:'101班',building:'立志樓',floor:'2F',students:34,type:'main'},
 {grade:'高一',name:'102班',building:'立志樓',floor:'2F',students:37,type:'main'},
 {grade:'高一',name:'103班',building:'立志樓',floor:'2F',students:36,type:'main'},
 {grade:'高一',name:'104班',building:'立志樓',floor:'2F',students:36,type:'main'},

 {grade:'高一',name:'108班',building:'立志樓',floor:'3F',students:34,type:'main'},

 {grade:'高二',name:'201班',building:'向陽樓',floor:'4F',students:28,type:'main'},
 {grade:'高二',name:'202班',building:'向陽樓',floor:'4F',students:41,type:'main'},

 {grade:'高二',name:'206班',building:'向陽樓',floor:'4F',students:44,type:'main'},

 {grade:'高二',name:'211班',building:'向陽樓',floor:'3F',students:34,type:'main'},
 {grade:'高二',name:'212班',building:'向陽樓',floor:'2F',students:33,type:'main'}
];

const floorPlan={
 '立志樓':{'4F':['706班','705班','704班','703班','702班','701班','110班','111班','112班','113班'],'3F':['806班','805班','804班','803班','802班','801班','105班','107班','108班','109班'],'2F':['906班','905班','904班','903班','902班','901班','101班','102班','103班','104班'],'1F':['106班']},
 '向陽樓':{'4F':['201班','202班','203班','204班','206班'],'3F':['207班','208班','209班','210班','211班'],'2F':['205班','212班']}
};

const moveSeed=[
 ['701班','702班',7],['701班','703班',6],['706班','704班',7],['706班','705班',6],
 ['801班','802班',6],['801班','803班',6],['806班','804班',4],['806班','805班',4],
 ['901班','902班',4],['901班','903班',5],['906班','904班',6],['906班','905班',4],
 ['102班','101班',1],['106班','101班',1],['107班','108班',1],['109班','108班',1],['110班','112班',1],['113班','112班',1],
 ['202班','201班',5],['203班','201班',3],['203班','204班',2],['206班','204班',8],['207班','204班',4],
 ['207班','205班',4],['208班','205班',4],['208班','209班',2],['208班','210班',2]
].map(([from,to,count])=>({from,to,count}));

const seeded=()=>({rooms:roomSeed.map(r=>({...r,target:r.type==='support'?0:36,note:r.type==='support'?'非考場，桌椅可供鄰近教室調度。':''})),moves:moveSeed.map(m=>({...m}))});
let state=load(),filter='all',activeRoom=null;
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));return s?.rooms?normalize(s):seeded()}catch{return seeded()}}
function normalize(s){roomSeed.forEach(seed=>{const room=s.rooms.find(r=>r.name===seed.name);if(!room)s.rooms.push({...seed,target:seed.type==='support'?0:36,note:''});else if(seed.name==='205班'||seed.name==='212班')room.type=seed.type});s.moves=Array.isArray(s.moves)?s.moves:moveSeed.map(m=>({...m}));return s}
function persist(msg='已儲存'){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render();toast(msg)}
const byName=n=>state.rooms.find(r=>r.name===n);
const incoming=n=>state.moves.filter(m=>m.to===n).reduce((s,m)=>s+m.count,0);
const outgoing=n=>state.moves.filter(m=>m.from===n).reduce((s,m)=>s+m.count,0);
const finalCount=r=>r.students+incoming(r.name)-outgoing(r.name);
const examRooms=()=>state.rooms.filter(r=>r.type==='main'||r.type==='reserve');

function render(){renderSummary();renderMap();renderMoves()}
function renderSummary(){const exam=examRooms(),main=exam.filter(r=>r.type==='main').length,reserve=exam.filter(r=>r.type==='reserve').length,desks=exam.reduce((s,r)=>s+r.students,0),need=exam.reduce((s,r)=>s+Math.max(0,36-r.students),0),extra=exam.reduce((s,r)=>s+Math.max(0,r.students-36),0),support=state.rooms.filter(r=>r.type==='support');summary.innerHTML=[['正式考場',`${main} 間`,''],['備用考場',`${reserve} 間`,''],['考場合計',`${exam.length} 間`,'sun'],['現有桌椅',`${desks} 套`,''],['原始缺少',`${need} 套`,'pink'],['原始多出',`${extra} 套`,'mint'],['支援教室',`${support.length} 間・${support.reduce((s,r)=>s+r.students,0)} 套`,'support']].map(([a,b,c])=>`<article class="stat ${c}"><i>${a}</i><strong>${b}</strong></article>`).join('');const net=exam.reduce((s,r)=>s+r.students-36,0);summaryNote.textContent=`36間教室共需 ${exam.length*36} 套桌椅；考場本身合計${net<0?`尚缺 ${-net} 套`:`多出 ${net} 套`}，可由圖中支援教室補齊。`}
function roomHTML(r){const show=filter==='all'||filter===r.type||(filter==='shortage'&&r.type!=='support'&&r.students<36)||(filter==='surplus'&&r.students>36);const current=finalCount(r),delta=r.students-r.target,label=r.type==='reserve'?'備用':r.type==='support'?'支援':'正式';let status,statusClass;if(r.type==='support'){status=`已支援 ${outgoing(r.name)} 套・剩餘 ${current} 套`;statusClass='support'}else if(delta<0){status=`缺少 ${-delta} 套`;statusClass='shortage'}else if(delta>0){status=`可支援 ${delta} 套`;statusClass='surplus'}else{status='剛好 36 套';statusClass='even'}const neighbors=neighborText(r);return`<button class="room ${r.type} ${show?'':'room-filtered'}" data-room="${r.name}"><header><h3>${r.name}</h3><span class="badge">${label}</span></header><div class="room-data"><span>班級人數<b>${r.students}人</b></span><span>${r.type==='support'?'現有桌椅':'目標桌椅'}<b>${r.type==='support'?r.students:36}套</b></span></div><div class="room-delta ${statusClass}">${status}</div>${neighbors?`<div class="neighbor-hint">${neighbors}</div>`:''}</button>`}
function neighborText(r){if(r.type==='support')return'';const names=floorPlan[r.building]?.[r.floor]||[],i=names.indexOf(r.name),near=[names[i-1],names[i+1]].filter(Boolean).map(byName).filter(Boolean);if(r.students<36){const donors=near.filter(x=>x.type==='support'||x.students>36).map(x=>`${x.name}可供${x.type==='support'?x.students:Math.max(0,x.students-36)}套`);return donors.length?`左右支援：${donors.join('、')}`:'左右鄰班無餘量，需跨區支援'}if(r.students>36)return`可優先支援：${near.filter(x=>x.students<36&&x.type!=='support').map(x=>x.name).join('、')||'同樓層缺額教室'}`;return''}
function renderMap(){buildingMap.innerHTML=Object.entries(floorPlan).map(([building,floors])=>`<section class="building"><header><h2>🏫 ${building}${building==='立志樓'?'（國中教學大樓）':''}</h2><span>${state.rooms.filter(r=>r.building===building&&(r.type==='main'||r.type==='reserve')).length} 間考場＋${state.rooms.filter(r=>r.building===building&&r.type==='support').length} 間支援教室</span></header>${Object.entries(floors).map(([floor,names])=>`<div class="floor ${names.length>=9?'dense-floor':''}"><div class="floor-label">${floor}</div><div class="rooms">${names.map(n=>roomHTML(byName(n))).join('')}</div></div>`).join('')}</section>`).join('');document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openRoom(b.dataset.room))}
function renderMoves(){movementList.innerHTML=state.moves.map(m=>`<div class="movement-row"><strong>${m.from}</strong><i>→</i><strong>${m.to}</strong><b>${m.count} 張</b></div>`).join('')+`<div class="movement-row outside"><strong>尚未補齊</strong><i>→</i><strong>高二考場</strong><b>8 張</b></div>`}
function openRoom(name){activeRoom=byName(name);roomTitle.textContent=`${name}｜${activeRoom.type==='main'?'正式考場':activeRoom.type==='reserve'?'備用考場':'桌椅支援教室'}`;roomLocation.textContent=`${activeRoom.building} ・ ${activeRoom.floor} ・ ${activeRoom.grade}`;studentCount.value=activeRoom.students;targetDesks.value=activeRoom.target;roomNote.value=activeRoom.note||'';const delta=activeRoom.students-activeRoom.target;dialogSummary.innerHTML=[['班級人數',`${activeRoom.students}人`],['目標桌椅',`${activeRoom.target}套`],['原始差額',delta<0?`缺${-delta}套`:delta>0?`多${delta}套`:'剛好'],['調度後',`${finalCount(activeRoom)}套`]].map(x=>`<span>${x[0]}<b>${x[1]}</b></span>`).join('');roomDialog.showModal()}
roomForm.addEventListener('submit',e=>{e.preventDefault();activeRoom.students=Math.max(0,+studentCount.value||0);activeRoom.target=Math.max(0,+targetDesks.value||0);activeRoom.note=roomNote.value.trim();roomDialog.close();persist(`${activeRoom.name} 已更新`)});
closeRoom.onclick=cancelRoom.onclick=()=>roomDialog.close();
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));renderMap()});
printBtn.onclick=()=>window.print();
exportBtn.onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='116學測考場配置備份.json';a.click();URL.revokeObjectURL(a.href)};
importInput.onchange=async e=>{try{state=normalize(JSON.parse(await e.target.files[0].text()));persist('資料已匯入')}catch{toast('備份檔格式不正確')}e.target.value=''};
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>toastEl.classList.remove('show'),1800)}
const toastEl=document.getElementById('toast');
render();
